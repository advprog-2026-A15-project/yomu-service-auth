spring.application.name=service-auth
server.port=8081

# Database Lokal (H2) khusus untuk Auth
spring.datasource.url=jdbc:h2:file:./.localdb/yomu_auth;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Google OAuth Credentials
yomu.google.client-id=${GOOGLE_CLIENT_ID}
yomu.google.client-secret=${GOOGLE_CLIENT_SECRET}

# gRPC Server
grpc.server.port=9091

# Actuator & Profiling
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# RabbitMQ - disable listener auto-startup locally (no listeners in auth service)   
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

